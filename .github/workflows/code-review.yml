name: Request review from my code-review bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: request-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send this PR to the central reviewer
        uses: actions/github-script@v7
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_ACTION: ${{ github.event.action }}
        with:
          github-token: ${{ secrets.REVIEW_DISPATCH_TOKEN }}
          script: |
            const owner = 'sanket-thorat';
            const repo = 'cloud-upskilling-code-review-bot';
            const ref = 'heads/feature/core-review-bot';
            const payload = {
              repository: process.env.TARGET_REPOSITORY,
              pr_number: Number(process.env.PR_NUMBER),
              head_sha: process.env.PR_HEAD_SHA,
              action: process.env.PR_EVENT_ACTION
            };
            const { data: branch } = await github.rest.git.getRef({owner, repo, ref});
            const { data: parent } = await github.rest.git.getCommit({
              owner, repo, commit_sha: branch.object.sha
            });
            const { data: request } = await github.rest.git.createCommit({
              owner, repo,
              message: `external-pr-review:${JSON.stringify(payload)}`,
              tree: parent.tree.sha,
              parents: [branch.object.sha]
            });
            await github.rest.git.updateRef({owner, repo, ref, sha: request.sha, force: false});
            await core.summary
              .addHeading('Central review requested')
              .addRaw(`Created an empty request commit on feature/core-review-bot. No reviewer files were changed.\n\n`)
              .addLink('View central review runs', `https://github.com/${owner}/${repo}/actions?query=branch%3Afeature%2Fcore-review-bot`)
              .addRaw('\n\nRequest success is not analysis completion. If the branch changed concurrently, rerun this job.\n')
              .write();